name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, n100]
    container: ubuntu:24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      LLVM_LIPO: llvm-lipo-18
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      KWEL_RELEASE: '1'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc libc6-dev python3 llvm-18 gh
      - name: Check out the exact workflow commit
        run: |
          source_dir="$(mktemp -d "$RUNNER_TEMP/kwel-source.XXXXXX")"
          git -C "$source_dir" init
          git -C "$source_dir" fetch --no-tags --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_DIR=%s\n' "$source_dir" >> "$GITHUB_ENV"
      - name: Install verified Go and SVG renderer
        run: |
          cd "$SOURCE_DIR"
          bash scripts/setup-ci-tools.sh
      - name: Verify release version
        run: |
          cd "$SOURCE_DIR"
          python3 scripts/check-release-version.py "$RELEASE_TAG"
      - name: Vet, race tests, argv checks and macOS Universal package
        run: |
          cd "$SOURCE_DIR"
          bash scripts/verify.sh
      - name: Generate checksum
        run: |
          cd "$SOURCE_DIR/dist"
          sha256sum Kwel.alfredworkflow > SHA256SUMS
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR/dist"
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf '%s\n' 'A release already exists for this tag; refusing to replace it.' >&2
            exit 1
          fi
          notes_file="$(mktemp "$RUNNER_TEMP/kwel-release-notes.XXXXXX")"
          printf '%s\n' \
            'Download Kwel.alfredworkflow and double-click it to import into Alfred 5 Powerpack.' \
            '' \
            'This release is not signed with an Apple Developer ID and is not notarized.' > "$notes_file"
          gh release create "$RELEASE_TAG" Kwel.alfredworkflow SHA256SUMS \
            --verify-tag --draft --title "Kwel for Alfred ${RELEASE_TAG#v}" \
            --notes-file "$notes_file"
          gh release edit "$RELEASE_TAG" --draft=false
