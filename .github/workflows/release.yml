name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a main commit and matching production version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/check-release-version.py "$RELEASE_TAG"
  validate:
    needs: preflight
    uses: ./.github/workflows/test.yml
    with:
      release-artifacts: true
    permissions:
      contents: read
  publish:
    needs: [preflight, validate]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-inputs
      - run: python3 scripts/collect-release.py release-inputs release
      - name: Publish only a complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf '%s\n' 'A Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          notes_file="$RUNNER_TEMP/kwel-release-notes.md"
          printf '%s\n' 'Kwel Connect Native Host for macOS, Windows and Ubuntu, plus Kwel for Alfred.' '' 'These installers are unsigned and are not notarized. OS security prompts may require explicit approval.' > "$notes_file"
          gh release create "$RELEASE_TAG" ./* --verify-tag --draft --title "Kwel Connect ${RELEASE_TAG#v}" --notes-file "$notes_file"
          gh release edit "$RELEASE_TAG" --draft=false
