name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag pointing to the selected main HEAD (e.g. v1.0.0)
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_EVENT: ${{ github.event_name }}
  RELEASE_REF: ${{ github.ref }}
  RELEASE_SHA: ${{ github.sha }}
  RELEASE_TAG: ${{ inputs.tag }}
  GH_REPO: ${{ github.repository }}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the manually selected main snapshot and existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-preflight.py
  validate:
    needs: preflight
    uses: ./.github/workflows/test.yml
    with:
      release-artifacts: true
    permissions:
      contents: read
  publish:
    needs: [preflight, validate]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck tag, snapshot and Release absence before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-preflight.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-inputs
      - run: python3 scripts/collect-release.py release-inputs release
      - name: Publish only a complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf '%s\n' 'A Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          notes_file="$RUNNER_TEMP/kwel-release-notes.md"
          printf '%s\n' 'Kwel Connect Native Host for macOS, Windows and Ubuntu, plus Kwel for Alfred.' '' 'These installers are unsigned and are not notarized. OS security prompts may require explicit approval.' > "$notes_file"
          gh release create "$RELEASE_TAG" ./* --verify-tag --draft --target "$RELEASE_SHA" --title "Kwel Connect ${RELEASE_TAG#v}" --notes-file "$notes_file"
          gh release edit "$RELEASE_TAG" --draft=false
