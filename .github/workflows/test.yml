name: Test

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, n100]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - name: Verify Linux build dependencies
        run: |
          test "$(uname -s)" = Linux
          cat /etc/os-release
          for tool in curl git gcc python3 tar sha256sum apt-get dpkg-deb; do
            command -v "$tool"
          done
      - name: Check out the exact workflow commit
        run: |
          source_dir="$(mktemp -d "$RUNNER_TEMP/kwel-source.XXXXXX")"
          git -C "$source_dir" init
          git -C "$source_dir" fetch --no-tags --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_DIR=%s\n' "$source_dir" >> "$GITHUB_ENV"
      - name: Install verified Go and SVG renderer
        run: |
          cd "$SOURCE_DIR"
          bash scripts/setup-ci-tools.sh
      - name: Vet, race tests, argv checks and macOS Universal package
        run: |
          cd "$SOURCE_DIR"
          bash scripts/verify.sh
